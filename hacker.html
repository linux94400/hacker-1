<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal Feast Catering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* Header */

        header {
            background: #8b0000;
            color: white;
            padding: 15px 25px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #f4b942;
        }

        /* Hero */

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

            background:
                linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
                url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1600&q=80")
                center/cover;
        }

        .hero h1 {
            color: white;
            font-size: 60px;
        }

        .hero p {
            color: white;
            font-size: 22px;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            background: #f4b942;
            padding: 15px 25px;
            border-radius: 30px;
            color: #222;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: white;
        }

        /* Sections */

        .section {
            padding: 60px 20px;
            text-align: center;
        }

        .section-title {
            color: #8b0000;
            font-size: 40px;
            margin-bottom: 30px;
        }

        /* Services */

        .services {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .service {
            width: 280px;
            padding: 25px;
            box-shadow: 0 5px 20px #ddd;
            border-radius: 15px;
        }

        .service h3 {
            margin: 15px 0;
        }

        /* Menu */

        .menu {
            background: #f5f5f5;
        }

        .menu-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .menu-card {
            width: 280px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .menu-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .menu-card-info {
            padding: 20px;
        }

        .menu-card h3 {
            margin-bottom: 10px;
        }

        /* Gallery */

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Booking */

        .booking {
            background: #f5f5f5;
        }

        .booking-form {
            max-width: 600px;
            margin: auto;
        }

        .booking-form input,
        .booking-form textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .booking-form button {
            width: 100%;
            padding: 15px;
            background: #8b0000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Reviews */

        .reviews {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .review {
            padding: 20px;
            max-width: 300px;
            box-shadow: 0 5px 15px #ddd;
            border-radius: 15px;
        }

        .review .stars {
            color: #f4b942;
        }

        /* Footer */

        footer {
            background: #222;
            color: white;
            padding: 30px;
            text-align: center;
        }

        /* WhatsApp */

        .whatsapp {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #25D366;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width: 768px) {

            .header {
                flex-direction: column;
            }

            nav {
                margin-top: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .reviews {
                flex-direction: column;
            }
        }
    </head>

    <body>

        <!-- HERO -->

        <div class="hero">
            <div>
                <h1>Royal Feast Catering</h1>
                <p>Delicious Food • Beautiful Events • Memorable Moments</p>

                <a class="btn" href="#booking">
                    Book Our Catering
                </a>
            </div>
        </div>

        <!-- SERVICES -->

        <section class="section">

            <h2 class="section-title">Our Services</h2>

            <div class="services">

                <div class="service">
                    <h2>🍛</h2>
                    <h3>Wedding Catering</h3>
                    <p>Traditional and modern food arrangements for weddings.</p>
                </div>

                <div class="service">
                    <h3>🎉</h3>
                    <p>Birthday parties, anniversaries and private celebrations.</p>
                </div>

                <div class="service">
                    <h2>🏢</h2>
                    <h3>Corporate Events</h3>
                    <p>Professional catering for meetings and corporate events.</p>
                </div>

            </div>

        </section>

        <!-- MENU -->

        <section class="section menu">

            <h2 class="section-title">Popular Menu</h2>

            <div class="menu-grid">

                <div class="menu-card">
                    <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950">
                    <div class="menu-card-info">
                        <h3>South Indian Meals</h3>
                        <p>Rice, dal, vegetables, curries and traditional sweets.</p>
                    </div>
            </div>

            <div class="menu-card">
                <img src="https://images.unsplash.com/photo-1563379091339-03246963d29a">

                <div class="menu-card-info">
                    <h3>Biryani</h3>
                    <p>Authentic aromatic biryani prepared with fresh ingredients.</p>
                </div>
            </div>

            <div class="menu-card">
                <h3>North Indian</h3>
                <p>Paneer, naan, curries and delicious Indian dishes.</p>
            </div>

        </div>

    </section>

    <!-- Gallery -->

    <section class="section">

        <h2 class="section-title">Our Food Gallery</h2>

        <div class="gallery">

            <img src="https://images.unsplash.com/photo-1547592180-85f173990554">

            <img src="https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7">

            <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950">

            <img src="https://images.unsplash.com/photo-1563379091339-03246963d29a">

        </div>

    </section>

    <!-- Booking -->

    <section class="section booking">

        <h2 class="section-title">Book Our Catering</h2>

        <form class="booking-form">

            <input type="text" placeholder="Your Name" required>

            <input type="text" placeholder="Phone Number">

            <input type="date">

            <input type="number" placeholder="Number of Guests">

            <input type="email" placeholder="Email">

            <textarea
                placeholder="Tell us about your event..."
                rows="5">
            </textarea>

            <button type="submit">
                Request Booking
            </button>

        </form>

    </section>

    <!-- Reviews -->

    <section class="section">

        <h2 class="section-title">What Our Customers Say</h2>

        <div class="reviews">

            <div class="review">
                <h3>★★★★★</h3>
                <p>
                    "The food was delicious and the service was excellent.
                    Everyone enjoyed the wedding dinner."
                </p>
                <p><b>Customer</b></p>
            </div>

            <div class="review">
                <h3>★★★★★</h3>
                <p>
                    "Very professional catering service.
                    The biryani was amazing!"
                </p>
                <p><b>Customer</b></p>
            </div>

        </div>

    </section>

    <!-- Contact -->

    <section class="section">

        <h2>Contact Us</h2>

        <p>
            📞 98765 43210
        </p>

        <p>
            📍 Hyderabad, Telangana
        </p>

    </section>

    <!-- Footer -->

        <div class="copyright">
            © 2026 Royal Feast Catering
        </div>

    </div>

    <script>
        document.querySelector(".booking-form").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Thank you! Your catering request has been received.");

        });
    </script>

</body>

</html>
